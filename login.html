<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PlanifProf | Connexion</title><link rel="stylesheet" href="styles.css"></head><body class="login-body"><main class="login-shell"><section class="login-card"><a class="brand login-brand" href="index.html"><span>✦</span> PlanifProf</a><p class="eyebrow">Connexion enseignant</p><h1>Accéder à mes données</h1><p class="muted">Chaque compte voit seulement ses horaires, groupes, élèves, plans de classe et résultats.</p><form id="loginForm" class="login-form"><label>Utilisateur<input id="username" autocomplete="username" placeholder="Identifiant ou courriel" required></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required></label><button class="btn full-width" type="submit">Se connecter</button><p id="loginError" class="login-error" role="alert"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const LOGIN_DOMAIN='planifprof.local';function usernameToEmail(v){const c=v.trim();return c.includes('@')?c:`${c}@${LOGIN_DOMAIN}`}async function redirectIfAlreadyConnected(){if(!window.PlanifProfSupabase)return;const{data}=await window.PlanifProfSupabase.auth.getSession();if(data.session)location.href='builder.html'}redirectIfAlreadyConnected();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='';if(!window.PlanifProfSupabase){err.textContent='Supabase n’est pas configuré. Remplace les valeurs dans supabase-config.js.';return}const{error}=await window.PlanifProfSupabase.auth.signInWithPassword({email:usernameToEmail(username.value),password:password.value});if(error){err.textContent='Utilisateur ou mot de passe invalide.';return}location.href='builder.html'});</script></body></html>
